[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "ruff>=0.2.0",
    "mypy>=1.0.0",
]

[project]
name = "rot-converter"
version = "3.0.1"
authors = [
    {name = "BasicSweater", email = "basicsweater@petalmail.com"},
]
description = "A library for the ROT cipher."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT OR GPL-3.0-or-later"}
keywords = ["rot", "converter", "release"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/BasicTShirt/rot-converter/blob/main/README.md"
Repository = "https://github.com/BasicTShirt/rot-converter"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
rot-converter = "rot_converter.cli:main"

[tool.ruff]
target-version = "py310"
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]
ignore = []

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
